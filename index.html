<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Vocabulaire — French Flashcards</title>
<style>
  :root {
    --bg: #0f1419;
    --card-bg: #1c2430;
    --accent: #5b8def;
    --accent2: #4a9d6f;
    --danger: #e0556f;
    --text: #e8ecf1;
    --muted: #8a93a3;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
  }
  header {
    padding: 20px 16px 12px;
    text-align: center;
  }
  header h1 {
    font-size: 1.4em;
    margin: 0 0 4px;
  }
  header .sub {
    color: var(--muted);
    font-size: 0.85em;
  }
  nav {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 0 16px 16px;
    flex-wrap: wrap;
  }
  nav button {
    background: var(--card-bg);
    color: var(--text);
    border: 1px solid #2a3542;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.9em;
    cursor: pointer;
  }
  nav button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 16px;
  }
  .screen { display: none; }
  .screen.active { display: block; }

  /* STUDY SCREEN */
  .unit-picker {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 12px;
    margin-bottom: 8px;
  }
  .unit-chip {
    flex: 0 0 auto;
    background: var(--card-bg);
    border: 1px solid #2a3542;
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.8em;
    cursor: pointer;
    white-space: nowrap;
  }
  .unit-chip.active {
    background: var(--accent2);
    color: #fff;
    border-color: var(--accent2);
  }
  .stats-row {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 0.85em;
    margin-bottom: 14px;
  }
  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 40px 24px;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    transition: transform 0.15s;
  }
  .card:active { transform: scale(0.98); }
  .card .unit-tag {
    position: absolute;
    top: 14px;
    left: 20px;
    font-size: 0.7em;
    color: var(--muted);
  }
  .card-wrap { position: relative; }
  .card .word {
    font-size: 1.8em;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .card .hint {
    color: var(--muted);
    font-size: 0.8em;
  }
  .card .translation {
    font-size: 1.3em;
    color: var(--accent);
    margin-bottom: 10px;
    font-weight: 600;
  }
  .card .example {
    color: var(--muted);
    font-size: 0.95em;
    font-style: italic;
  }
  .grade-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .grade-row button {
    flex: 1;
    padding: 14px 0;
    border: none;
    border-radius: 12px;
    font-size: 0.95em;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
  }
  .grade-row .again { background: var(--danger); }
  .grade-row .good { background: var(--accent); }
  .grade-row .easy { background: var(--accent2); }
  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
  }
  .empty-state .big { font-size: 3em; margin-bottom: 10px; }

  /* MANAGE SCREEN */
  .form-box {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  .form-box input, .form-box select {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 10px;
    border-radius: 8px;
    border: 1px solid #2a3542;
    background: #141a22;
    color: var(--text);
    font-size: 0.95em;
  }
  .form-box button {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
  }
  .word-list { margin-top: 10px; }
  .unit-section { margin-bottom: 18px; }
  .unit-section h3 {
    font-size: 0.9em;
    color: var(--muted);
    border-bottom: 1px solid #2a3542;
    padding-bottom: 6px;
  }
  .word-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #1c2430;
  }
  .word-row .w { font-weight: 600; }
  .word-row .t { color: var(--muted); font-size: 0.85em; }
  .word-row .del {
    background: none;
    border: none;
    color: var(--danger);
    font-size: 1.1em;
    cursor: pointer;
    padding: 4px 8px;
  }
  .level-badge {
    font-size: 0.65em;
    padding: 2px 6px;
    border-radius: 6px;
    background: #2a3542;
    color: var(--muted);
    margin-left: 6px;
  }
  .toolbar {
    display: flex;
    gap: 8px;
    margin: 10px 0 20px;
  }
  .toolbar button {
    flex: 1;
    padding: 10px;
    background: var(--card-bg);
    color: var(--text);
    border: 1px solid #2a3542;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85em;
  }
  #importFile { display: none; }
</style>
</head>
<body>

<header>
  <h1>🇫🇷 Mon Vocabulaire</h1>
  <div class="sub">Your B1 flashcards, organized by unit</div>
</header>

<nav>
  <button class="active" data-screen="study">Study</button>
  <button data-screen="manage">Manage</button>
</nav>

<main>

  <!-- STUDY SCREEN -->
  <div class="screen active" id="screen-study">
    <div class="unit-picker" id="unitPicker"></div>
    <div class="stats-row">
      <span id="dueCount">0 due</span>
      <span id="totalCount">0 total</span>
    </div>
    <div id="studyArea"></div>
  </div>

  <!-- MANAGE SCREEN -->
  <div class="screen" id="screen-manage">
    <div class="form-box">
      <input type="text" id="newUnit" placeholder="Unit (e.g. Unit 3 - Le temps libre)" list="unitList">
      <datalist id="unitList"></datalist>
      <input type="text" id="newWord" placeholder="French word/phrase">
      <input type="text" id="newTranslation" placeholder="English translation">
      <input type="text" id="newExample" placeholder="Example sentence (French)">
      <button id="addWordBtn">+ Add word</button>
    </div>
    <div class="toolbar">
      <button id="exportBtn">⬇ Export backup</button>
      <button id="importBtn">⬆ Import backup</button>
      <input type="file" id="importFile" accept="application/json">
    </div>
    <div class="word-list" id="wordList"></div>
  </div>

</main>

<script>
const STORAGE_KEY = 'french_flashcards_v1';

// ---- Simple SRS: box system, simpler than Anki ----
// level 0 -> due immediately / same session
// level 1 -> +1 day
// level 2 -> +3 days
// level 3 -> +7 days
// level 4 -> +16 days
// level 5+ -> +30 days (mastered, capped)
const INTERVALS = [0, 1, 3, 7, 16, 30];

function todayStr() {
  return new Date().toISOString().slice(0,10);
}
function addDays(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}

// ---- Seed data: basic B1 French vocab across units ----
const SEED = [
  // Unit 1 - La vie quotidienne (daily life)
  ["Unit 1 - La vie quotidienne","se réveiller","to wake up","Je me réveille à sept heures chaque matin."],
  ["Unit 1 - La vie quotidienne","le quotidien","daily life / routine","Le quotidien peut devenir monotone."],
  ["Unit 1 - La vie quotidienne","faire les courses","to go grocery shopping","Nous faisons les courses le samedi."],
  ["Unit 1 - La vie quotidienne","se dépêcher","to hurry","Dépêche-toi, on va être en retard !"],
  ["Unit 1 - La vie quotidienne","l'emploi du temps","schedule / timetable","Mon emploi du temps est très chargé cette semaine."],
  ["Unit 1 - La vie quotidienne","s'habituer à","to get used to","Je me suis habitué à me lever tôt."],
  ["Unit 1 - La vie quotidienne","le quartier","neighbourhood","J'adore le quartier où j'habite."],
  ["Unit 1 - La vie quotidienne","davantage","more / further","Il faut davantage de temps pour finir."],

  // Unit 2 - Les études et le travail (studies and work)
  ["Unit 2 - Les études et le travail","le stage","internship","Elle fait un stage dans une entreprise suisse."],
  ["Unit 2 - Les études et le travail","réussir un examen","to pass an exam","J'espère réussir mon examen de français."],
  ["Unit 2 - Les études et le travail","poursuivre des études","to continue studying","Il va poursuivre ses études à l'université."],
  ["Unit 2 - Les études et le travail","embaucher","to hire","L'entreprise va embaucher dix nouveaux employés."],
  ["Unit 2 - Les études et le travail","un entretien d'embauche","job interview","J'ai un entretien d'embauche demain matin."],
  ["Unit 2 - Les études et le travail","le salaire","salary","Le salaire proposé est correct."],
  ["Unit 2 - Les études et le travail","bénévole","volunteer (adj/noun)","Elle travaille comme bénévole dans une association."],
  ["Unit 2 - Les études et le travail","épanouissant","fulfilling","C'est un métier très épanouissant."],

  // Unit 3 - L'environnement (environment)
  ["Unit 3 - L'environnement","le réchauffement climatique","global warming","Le réchauffement climatique inquiète les scientifiques."],
  ["Unit 3 - L'environnement","gaspiller","to waste","Il ne faut pas gaspiller l'eau."],
  ["Unit 3 - L'environnement","les déchets","waste / rubbish","Nous devons réduire nos déchets."],
  ["Unit 3 - L'environnement","durable","sustainable","Le développement durable est essentiel."],
  ["Unit 3 - L'environnement","une empreinte carbone","carbon footprint","Réduire son empreinte carbone est possible."],
  ["Unit 3 - L'environnement","recycler","to recycle","On recycle le verre et le papier."],
  ["Unit 3 - L'environnement","la pénurie","shortage","Il y a une pénurie d'eau dans certaines régions."],
  ["Unit 3 - L'environnement","sensibiliser","to raise awareness","Il faut sensibiliser les jeunes à l'écologie."],

  // Unit 4 - Les voyages et les vacances (travel and holidays)
  ["Unit 4 - Les voyages et les vacances","un hébergement","accommodation","Nous cherchons un hébergement pas cher."],
  ["Unit 4 - Les voyages et les vacances","le dépaysement","change of scenery","Voyager offre un vrai dépaysement."],
  ["Unit 4 - Les voyages et les vacances","un séjour","stay / trip","Notre séjour à Paris était inoubliable."],
  ["Unit 4 - Les voyages et les vacances","à l'étranger","abroad","Elle a étudié un an à l'étranger."],
  ["Unit 4 - Les voyages et les vacances","un itinéraire","itinerary / route","Nous avons préparé un itinéraire détaillé."],
  ["Unit 4 - Les voyages et les vacances","profiter de","to make the most of","Profitons de ce beau temps !"],
  ["Unit 4 - Les voyages et les vacances","une auberge de jeunesse","youth hostel","On a dormi dans une auberge de jeunesse."],
  ["Unit 4 - Les voyages et les vacances","dépayser","to give a change of scenery","Ce voyage va nous dépayser complètement."],

  // Unit 5 - La santé et le bien-être (health and wellbeing)
  ["Unit 5 - La santé et le bien-être","le stress","stress","Le stress affecte beaucoup d'étudiants."],
  ["Unit 5 - La santé et le bien-être","se détendre","to relax","J'aime me détendre en lisant un livre."],
  ["Unit 5 - La santé et le bien-être","une alimentation équilibrée","balanced diet","Il est important d'avoir une alimentation équilibrée."],
  ["Unit 5 - La santé et le bien-être","faire du sport","to do sport / exercise","Je fais du sport trois fois par semaine."],
  ["Unit 5 - La santé et le bien-être","le sommeil","sleep","Le manque de sommeil est mauvais pour la santé."],
  ["Unit 5 - La santé et le bien-être","soigner","to treat / take care of","Le médecin va soigner sa blessure."],
  ["Unit 5 - La santé et le bien-être","épuisé","exhausted","Après le marathon, il était complètement épuisé."],
  ["Unit 5 - La santé et le bien-être","prendre soin de soi","to take care of oneself","Il faut prendre soin de soi, surtout en période d'examens."],

  // Unit 6 - La technologie et les médias (technology and media)
  ["Unit 6 - La technologie et les médias","un réseau social","social network","Beaucoup de jeunes passent du temps sur les réseaux sociaux."],
  ["Unit 6 - La technologie et les médias","la vie privée","privacy","Il faut protéger sa vie privée en ligne."],
  ["Unit 6 - La technologie et les médias","télécharger","to download","J'ai téléchargé une nouvelle application."],
  ["Unit 6 - La technologie et les médias","un outil","a tool","Internet est un outil puissant pour apprendre."],
  ["Unit 6 - La technologie et les médias","méfiant","wary / distrustful","Il faut être méfiant face aux fausses informations."],
  ["Unit 6 - La technologie et les médias","un influenceur","influencer","Certains jeunes rêvent de devenir influenceurs."],
  ["Unit 6 - La technologie et les médias","la désinformation","misinformation","La désinformation se propage vite en ligne."],
  ["Unit 6 - La technologie et les médias","un avantage / un inconvénient","advantage / disadvantage","Chaque technologie a ses avantages et ses inconvénients."]
];

function seedData() {
  const now = todayStr();
  return SEED.map((row, i) => ({
    id: 'seed-' + i,
    unit: row[0],
    word: row[1],
    translation: row[2],
    example: row[3],
    level: 0,
    nextReview: now
  }));
}

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    try { return JSON.parse(raw); } catch(e) { /* fall through */ }
  }
  const seeded = seedData();
  saveData(seeded);
  return seeded;
}
function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let words = loadData();
let currentUnitFilter = 'ALL';
let studyQueue = [];
let currentCard = null;
let flipped = false;

function getUnits() {
  const set = new Set(words.map(w => w.unit));
  return Array.from(set).sort();
}

function buildStudyQueue() {
  const today = todayStr();
  let pool = words.filter(w => currentUnitFilter === 'ALL' || w.unit === currentUnitFilter);
  studyQueue = pool.filter(w => w.nextReview <= today);
  // shuffle
  for (let i = studyQueue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [studyQueue[i], studyQueue[j]] = [studyQueue[j], studyQueue[i]];
  }
}

function renderUnitPicker() {
  const picker = document.getElementById('unitPicker');
  const units = getUnits();
  let html = `<div class="unit-chip ${currentUnitFilter==='ALL'?'active':''}" data-unit="ALL">All units</div>`;
  units.forEach(u => {
    html += `<div class="unit-chip ${currentUnitFilter===u?'active':''}" data-unit="${escapeHtml(u)}">${escapeHtml(u.replace(/^Unit \d+ - /,''))}</div>`;
  });
  picker.innerHTML = html;
  picker.querySelectorAll('.unit-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      currentUnitFilter = chip.dataset.unit;
      buildStudyQueue();
      renderUnitPicker();
      nextCard();
    });
  });
}

function renderStats() {
  const today = todayStr();
  const pool = words.filter(w => currentUnitFilter === 'ALL' || w.unit === currentUnitFilter);
  const due = pool.filter(w => w.nextReview <= today).length;
  document.getElementById('dueCount').textContent = due + ' due';
  document.getElementById('totalCount').textContent = pool.length + ' total';
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function nextCard() {
  renderStats();
  const area = document.getElementById('studyArea');
  if (studyQueue.length === 0) {
    area.innerHTML = `<div class="empty-state"><div class="big">🎉</div>All caught up!<br><span style="font-size:0.85em">No cards due right now in this unit.</span></div>`;
    currentCard = null;
    return;
  }
  currentCard = studyQueue[0];
  flipped = false;
  renderCard();
}

function renderCard() {
  const area = document.getElementById('studyArea');
  if (!currentCard) return;
  const unitShort = currentCard.unit.replace(/^Unit \d+ - /, '');
  let inner;
  if (!flipped) {
    inner = `
      <div class="card-wrap">
        <div class="card" id="flipCard">
          <div class="unit-tag">${escapeHtml(unitShort)}</div>
          <div class="word">${escapeHtml(currentCard.word)}</div>
          <div class="hint">Tap to reveal</div>
        </div>
      </div>
    `;
  } else {
    inner = `
      <div class="card-wrap">
        <div class="card" id="flipCard">
          <div class="unit-tag">${escapeHtml(unitShort)}</div>
          <div class="word">${escapeHtml(currentCard.word)}</div>
          <div class="translation">${escapeHtml(currentCard.translation)}</div>
          <div class="example">${escapeHtml(currentCard.example)}</div>
        </div>
      </div>
      <div class="grade-row">
        <button class="again" data-grade="again">Again</button>
        <button class="good" data-grade="good">Good</button>
        <button class="easy" data-grade="easy">Easy</button>
      </div>
    `;
  }
  area.innerHTML = inner;
  const cardEl = document.getElementById('flipCard');
  if (!flipped) {
    cardEl.addEventListener('click', () => { flipped = true; renderCard(); });
  } else {
    area.querySelectorAll('[data-grade]').forEach(btn => {
      btn.addEventListener('click', () => grade(btn.dataset.grade));
    });
  }
}

function grade(g) {
  const w = currentCard;
  if (g === 'again') {
    w.level = 0;
    w.nextReview = todayStr(); // stays due, will cycle to back of queue
  } else if (g === 'good') {
    w.level = Math.min(w.level + 1, INTERVALS.length - 1);
    w.nextReview = addDays(todayStr(), INTERVALS[w.level]);
  } else if (g === 'easy') {
    w.level = Math.min(w.level + 2, INTERVALS.length - 1);
    w.nextReview = addDays(todayStr(), INTERVALS[w.level]);
  }
  saveData(words);
  // remove from front of queue
  studyQueue.shift();
  if (g === 'again') {
    // push back to end of this session's queue so it comes up again
    studyQueue.push(w);
  }
  nextCard();
}

// ---- MANAGE SCREEN ----
function renderUnitDatalist() {
  const dl = document.getElementById('unitList');
  dl.innerHTML = getUnits().map(u => `<option value="${escapeHtml(u)}">`).join('');
}

function renderWordList() {
  const container = document.getElementById('wordList');
  const units = getUnits();
  let html = '';
  units.forEach(unit => {
    const unitWords = words.filter(w => w.unit === unit);
    html += `<div class="unit-section"><h3>${escapeHtml(unit)} (${unitWords.length})</h3>`;
    unitWords.forEach(w => {
      html += `
        <div class="word-row">
          <div>
            <div class="w">${escapeHtml(w.word)} <span class="level-badge">Lv ${w.level}</span></div>
            <div class="t">${escapeHtml(w.translation)}</div>
          </div>
          <button class="del" data-id="${w.id}">✕</button>
        </div>
      `;
    });
    html += `</div>`;
  });
  container.innerHTML = html || '<div class="empty-state">No words yet. Add one above!</div>';
  container.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', () => {
      words = words.filter(w => w.id !== btn.dataset.id);
      saveData(words);
      renderWordList();
      renderUnitDatalist();
      renderUnitPicker();
      buildStudyQueue();
    });
  });
}

document.getElementById('addWordBtn').addEventListener('click', () => {
  const unit = document.getElementById('newUnit').value.trim();
  const word = document.getElementById('newWord').value.trim();
  const translation = document.getElementById('newTranslation').value.trim();
  const example = document.getElementById('newExample').value.trim();
  if (!unit || !word || !translation) {
    alert('Please fill in at least unit, word, and translation.');
    return;
  }
  words.push({
    id: 'w-' + Date.now() + '-' + Math.floor(Math.random()*1000),
    unit, word, translation, example,
    level: 0,
    nextReview: todayStr()
  });
  saveData(words);
  document.getElementById('newWord').value = '';
  document.getElementById('newTranslation').value = '';
  document.getElementById('newExample').value = '';
  renderWordList();
  renderUnitDatalist();
  renderUnitPicker();
  buildStudyQueue();
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(words, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mon-vocabulaire-backup-' + todayStr() + '.json';
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      if (!Array.isArray(imported)) throw new Error('bad format');
      words = imported;
      saveData(words);
      renderWordList();
      renderUnitDatalist();
      renderUnitPicker();
      buildStudyQueue();
      nextCard();
      alert('Import successful!');
    } catch (err) {
      alert('Could not import: invalid file.');
    }
  };
  reader.readAsText(file);
});

// ---- NAV ----
document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + btn.dataset.screen).classList.add('active');
    if (btn.dataset.screen === 'manage') {
      renderWordList();
      renderUnitDatalist();
    }
  });
});

// ---- INIT ----
renderUnitPicker();
buildStudyQueue();
nextCard();
renderWordList();
renderUnitDatalist();
</script>

</body>
</html>
